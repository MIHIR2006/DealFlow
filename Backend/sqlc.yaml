version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/db/sqlc
        sql_package: pgx/v5

        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false

        overrides:
          # Money never becomes a float. pgx v5 round-trips NUMERIC through
          # shopspring/decimal via its sql.Scanner fallback -- no codec needed;
          # see the round-trip tests in internal/platform/db.
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"

          # Plain time.Time rather than pgtype wrappers. Timestamps cross into
          # the domain engines and the API contract, and neither should have
          # to know which driver produced them.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "timestamp"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

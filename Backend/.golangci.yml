version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G104

  exclusions:
    rules:
      # Generated query code is not ours to lint.
      - path: internal/db/sqlc/
        linters: [revive, gosec, errorlint, unconvert, staticcheck]
      # Table-driven tests read better without some of these.
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
